<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash JS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0e15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #00ffcc;
        }

        canvas {
            display: block;
            background: #11131e;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            box-shadow: 0 0 10px #00ffcc;
            transition: width 0.1s linear;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,255,204,0.8);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .overlay h1 {
            font-size: 48px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #0088ff);
            border: none;
            color: #000;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas" width="800" height="450"></canvas>
        
        <div class="ui-layer">
            <div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="stats" style="margin-top: 8px;">
                    <span id="progress-text">0%</span>
                    <span id="high-score-text">EN İYİ: 0%</span>
                </div>
            </div>
        </div>

        <div id="start-overlay" class="overlay">
            <h1>GEOMETRY DASH</h1>
            <p>Zıplamak için SPACE, W, YUKARI OK veya TIKLA</p>
            <button class="btn" id="start-btn">OYUNA BAŞLA</button>
        </div>

        <div id="gameover-overlay" class="overlay hidden">
            <h1 style="color: #ff3366; text-shadow: 0 0 20px #ff3366;">ELENDİN!</h1>
            <p id="death-stat">İlerleme: %0</p>
            <button class="btn" id="restart-btn">TEKRAR DENE</button>
        </div>
    </div>

    <script>
        // --- SES MOTORU (Web Audio API) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.bgInterval = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            startMusic() {
                if (!this.ctx) return;
                this.stopMusic();
                
                let step = 0;
                const notes = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63]; // C3 - C4
                
                this.bgInterval = setInterval(() => {
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'triangle';
                    const freq = notes[(step % 8)] * (step % 16 < 8 ? 1 : 1.25);
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                    step++;
                }, 130);
            }

            stopMusic() {
                if (this.bgInterval) {
                    clearInterval(this.bgInterval);
                    this.bgInterval = null;
                }
            }
        }

        const audio = new SoundEngine();

        // --- OYUN AYARLARI VE DEĞİŞKENLER ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 450;
        const GROUND_Y = 370;
        const GRAVITY = 1.15;
        const JUMP_FORCE = -15.5;
        const SPEED = 7.5;

        let gameActive = false;
        let animationFrameId = null;
        let cameraX = 0;
        let maxLevelWidth = 15000;
        let highScore = localStorage.getItem('gd_highscore') || 0;

        document.getElementById('high-score-text').innerText = `EN İYİ: ${highScore}%`;

        // --- KULLANICI GİRDİLERİ ---
        const keys = {};
        let jumpRequested = false;

        function handleInputStart() {
            jumpRequested = true;
        }

        function handleInputEnd() {
            jumpRequested = false;
        }

        window.addEventListener('keydown', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                if (!keys[e.code]) handleInputStart();
                keys[e.code] = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                keys[e.code] = false;
                handleInputEnd();
            }
        });

        canvas.addEventListener('mousedown', handleInputStart);
        canvas.addEventListener('mouseup', handleInputEnd);
        canvas.addEventListener('touchstart', (e) => {
            handleInputStart();
            e.preventDefault();
        });
        canvas.addEventListener('touchend', handleInputEnd);

        // --- OYUNCU (CUBE) ---
        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = 100;
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.rotation = 0;
                this.isGrounded = true;
                this.color = '#00ffcc';
            }

            update() {
                // Yerçekimi
                this.vy += GRAVITY;
                this.y += this.vy;
                this.x += SPEED;

                // Zıplama mantığı
                if (jumpRequested && this.isGrounded) {
                    this.vy = JUMP_FORCE;
                    this.isGrounded = false;
                    audio.playJump();
                    createJumpParticles(this.x + this.width / 2, this.y + this.height);
                }

                // Zemin kontrolü
                if (this.y + this.height >= GROUND_Y) {
                    this.y = GROUND_Y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                // Dönüş animasyonu
                if (!this.isGrounded) {
                    this.rotation += 8;
                } else {
                    // Yere inince en yakın 90 dereceye hizala
                    this.rotation = Math.round(this.rotation / 90) * 90;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x - cameraX + this.width / 2, this.y + this.height / 2);
                ctx.rotate((this.rotation * Math.PI) / 180);

                // Dış Parlama
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // Gövde
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

                // İç Desen / İkinci Kare
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(-this.width / 2, -this.height / 2, this.width, this.height);

                ctx.fillStyle = '#111';
                ctx.fillRect(-this.width / 4, -this.height / 4, this.width / 2, this.height / 2);

                ctx.restore();
            }
        }

        // --- ENGELLER ---
        class Spike {
            constructor(x) {
                this.x = x;
                this.width = 40;
                this.height = 40;
                this.y = GROUND_Y - this.height;
            }

            draw() {
                const screenX = this.x - cameraX;
                if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;

                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3366';

                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                ctx.moveTo(screenX, this.y + this.height);
                ctx.lineTo(screenX + this.width / 2, this.y);
                ctx.lineTo(screenX + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            getBounds() {
                // Daraltılmış çarpışma kutusu (Hitbox)
                const padding = 8;
                return {
                    x: this.x + padding,
                    y: this.y + padding,
                    width: this.width - padding * 2,
                    height: this.height - padding
                };
            }
        }

        class Block {
            constructor(x, yScale = 1) {
                this.x = x;
                this.width = 40;
                this.height = 40 * yScale;
                this.y = GROUND_Y - this.height;
            }

            draw() {
                const screenX = this.x - cameraX;
                if (screenX < -50 || screenX > CANVAS_WIDTH + 50) return;

                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0099ff';

                ctx.fillStyle = '#001133';
                ctx.fillRect(screenX, this.y, this.width, this.height);

                ctx.strokeStyle = '#0099ff';
                ctx.lineWidth = 3;
                ctx.strokeRect(screenX, this.y, this.width, this.height);

                ctx.restore();
            }

            getBounds() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }
        }

        // --- PARÇACIK SİSTEMİ ---
        let particles = [];

        function createExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? '#00ffcc' : '#ff3366',
                    life: 1
                });
            }
        }

        function createJumpParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * -3,
                    size: Math.random() * 4 + 2,
                    color: 'rgba(255, 255, 255, 0.7)',
                    life: 0.6
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
                    ctx.restore();
                }
            }
        }

        // --- HARİTA OLUŞTURMA ---
        let player = new Player();
        let obstacles = [];

        function generateLevel() {
            obstacles = [];
            let x = 700;

            while (x < maxLevelWidth) {
                const rand = Math.random();

                if (rand < 0.35) {
                    // Tek Diken
                    obstacles.push(new Spike(x));
                    x += 350 + Math.random() * 200;
                } else if (rand < 0.6) {
                    // Çift Diken
                    obstacles.push(new Spike(x));
                    obstacles.push(new Spike(x + 40));
                    x += 400 + Math.random() * 200;
                } else if (rand < 0.8) {
                    // Blok + Diken
                    obstacles.push(new Block(x, 1));
                    obstacles.push(new Spike(x + 40));
                    x += 450 + Math.random() * 200;
                } else {
                    // Yüksek Blok Merdiveni
                    obstacles.push(new Block(x, 1));
                    obstacles.push(new Block(x + 40, 2));
                    obstacles.push(new Spike(x + 120));
                    x += 500 + Math.random() * 250;
                }
            }
        }

        // --- ÇARPIŞMA TESTİ (AABB) ---
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function handleCollisions() {
            const pBounds = { x: player.x, y: player.y, width: player.width, height: player.height };

            for (let obs of obstacles) {
                const oBounds = obs.getBounds();

                if (checkCollision(pBounds, oBounds)) {
                    if (obs instanceof Spike) {
                        gameOver();
                        return;
                    } else if (obs instanceof Block) {
                        // Blok üzerine basma kontrolü
                        const prevY = player.y - player.vy;
                        if (prevY + player.height <= obs.y + 12) {
                            player.y = obs.y - player.height;
                            player.vy = 0;
                            player.isGrounded = true;
                        } else {
                            // Yandan çarpışma -> Ölüm
                            gameOver();
                            return;
                        }
                    }
                }
            }
        }

        // --- ARKA PLAN VE ZEMİN BÖLÜMÜ ---
        function drawBackground() {
            // Arka Plan Izgarası (Grid Effect)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            const offsetX = cameraX % gridSize;

            for (let x = -offsetX; x < CANVAS_WIDTH; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }

            // Zemin
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.fillStyle = '#0a0d14';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();
            ctx.restore();
        }

        // --- DÖNGÜ VE OYUN DURUMLARI ---
        function resetGame() {
            player = new Player();
            cameraX = 0;
            particles = [];
            generateLevel();
        }

        function startGame() {
            audio.init();
            audio.startMusic();
            resetGame();
            gameActive = true;

            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function gameOver() {
            gameActive = false;
            audio.stopMusic();
            audio.playExplosion();
            createExplosion(player.x + player.width / 2, player.y + player.height / 2);

            const progress = Math.min(100, Math.floor((player.x / maxLevelWidth) * 100));
            if (progress > highScore) {
                highScore = progress;
                localStorage.setItem('gd_highscore', highScore);
                document.getElementById('high-score-text').innerText = `EN İYİ: ${highScore}%`;
            }

            document.getElementById('death-stat').innerText = `İlerleme: %${progress}`;
            setTimeout(() => {
                document.getElementById('gameover-overlay').classList.remove('hidden');
            }, 600);
        }

        function updateUI() {
            const progress = Math.min(100, Math.floor((player.x / maxLevelWidth) * 100));
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${progress}%`;

            if (progress >= 100) {
                gameActive = false;
                alert('TEBRİKLER! Bölümü Tamamladın! 🎉');
                startGame();
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (gameActive) {
                player.update();
                cameraX = player.x - 150;
                handleCollisions();
                updateUI();
            }

            drawBackground();

            for (let obs of obstacles) {
                obs.draw();
            }

            player.draw();
            updateParticles();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- EVENT LISTENERS ---
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // İlk ekranı çiz
        drawBackground();
    </script>
</body>
</html>
